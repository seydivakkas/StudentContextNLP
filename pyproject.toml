[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "studentcontextnlp"
version = "0.1.0"
description = "Offline lexical and semantic benchmark for question-context impact on student responses"
readme = "README_TR.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
parquet = ["pyarrow>=15,<24"]
semantic = ["sentence-transformers>=3,<6"]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
