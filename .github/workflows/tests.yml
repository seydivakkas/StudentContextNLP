name: Python offline synthetic tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (CPU, no model download)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run synthetic software tests
        run: python -m pytest -q
      - name: Verify no committed private model/data artifacts
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          prohibited = [f for f in files if f.endswith(('.joblib','.parquet','.csv')) or f.startswith('data/raw/') and not f.endswith('.gitkeep')]
          if prohibited: raise SystemExit('Tracked prohibited files: '+str(prohibited))
          print('No data/model artifacts committed')
          PY
